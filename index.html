<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم الديناميكي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f7f7; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-3 text-slate-800">

    <div class="flex gap-2 overflow-x-auto pb-3 mb-4 scrollbar-none" id="categories-bar">
        <button onclick="filterProducts('all')" class="category-btn bg-amber-500 text-white font-bold px-4 py-2 rounded-xl text-xs flex-shrink-0 shadow-sm">الكل</button>
    </div>

    <div class="grid grid-cols-2 gap-3" id="products-grid">
        <div class="col-span-2 text-center py-10 text-slate-400 text-sm">جاري تحميل المنيو الساخن... 🔥</div>
    </div>

    <div id="product-modal" class="fixed inset-0 bg-black/50 z-50 flex items-end justify-center hidden">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-4 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-white/80 backdrop-blur-md rounded-full p-2 text-slate-600 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <img id="modal-img" src="" class="w-full h-56 object-cover rounded-2xl mb-4" alt="">
            <div class="text-right mb-4">
                <div class="flex justify-between items-start mb-1">
                    <h2 id="modal-title" class="text-lg font-black text-slate-900"></h2>
                    <span id="modal-price-display" class="text-md font-extrabold text-amber-600"></span>
                </div>
                <p id="modal-desc" class="text-xs text-slate-400 leading-relaxed font-medium"></p>
            </div>
            <hr class="border-slate-100 my-4">
            <div class="flex items-center gap-3 justify-between mt-4">
                <div class="flex items-center border border-slate-200 rounded-xl bg-slate-50 p-1">
                    <button onclick="updateQty(1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg font-bold">+</button>
                    <span id="qty-text" class="px-4 font-black text-slate-800 text-sm">1</span>
                    <button onclick="updateQty(-1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg font-bold">-</button>
                </div>
                <button onclick="sendOrderToBot()" class="flex-1 bg-zinc-500 hover:bg-zinc-600 text-white font-bold py-3 px-6 rounded-xl text-center text-sm">
                    إضافة ( <span id="total-price-btn">0.00</span> EGP )
                </button>
            </div>
        </div>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // ⚠️ ضع هنا رابط الـ Production Webhook الذي نسخته من n8n
const WEBHOOK_URL = 'https://widow-curing-carving.ngrok-free.dev/webhook/get-menu';
        let allProducts = [];
        let currentProduct = { name: '', price: 0, qty: 1 };

        // وظيفة جلب البيانات من الداتا بيز عبر n8n بمجرد فتح الموقع
        async function loadMenu() {
            try {
                const response = await fetch(WEBHOOK_URL);
                allProducts = await response.json();
                
                renderCategories();
                renderProducts('all');
            } catch (error) {
                document.getElementById('products-grid').innerHTML = `<div class="col-span-2 text-center text-red-500 text-xs">عذراً، فشل الاتصال بالسيرفر!</div>`;
            }
        }

        // استخراج الأقسام الفريدة ورسم الأزرار علوياً
        function renderCategories() {
            const categoriesBar = document.getElementById('categories-bar');
            const categories = ['all', ...new Set(allProducts.map(p => p.category))];
            
            categoriesBar.innerHTML = ''; // تصفير الهيكل
            categories.forEach(cat => {
                const isAll = cat === 'all';
                const btn = document.createElement('button');
                btn.className = `category-btn ${isAll ? 'bg-amber-500 text-white' : 'bg-white text-slate-600'} font-semibold px-4 py-2 rounded-xl text-xs flex-shrink-0 shadow-sm border border-slate-100`;
                btn.innerText = isAll ? 'الكل' : cat;
                btn.onclick = (e) => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('bg-amber-500', 'text-white'));
                    btn.classList.add('bg-amber-500', 'text-white');
                    renderProducts(cat);
                };
                categoriesBar.appendChild(btn);
            });
        }

        // رسم كروت الأصناف بناءً على القسم المختار
        function renderProducts(category) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            const filtered = category === 'all' ? allProducts : allProducts.filter(p => p.category === category);
            
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100 p-2 cursor-pointer";
                card.onclick = () => openModal(p.name, p.price, p.description, p.image || 'https://via.placeholder.com/300');
                card.innerHTML = `
                    <img src="${p.image || 'https://via.placeholder.com/300'}" class="w-full h-28 object-cover rounded-xl">
                    <div class="mt-2 text-right">
                        <h3 class="text-xs font-bold text-slate-900">${p.name}</h3>
                        <div class="mt-2"><span class="text-xs font-black text-amber-600">${p.price} EGP</span></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

function openModal(name, price, desc, img) {
    currentProduct = { name: name, price: parseFloat(price), qty: 1 };
    document.getElementById('modal-title').innerText = name;
    document.getElementById('modal-price-display').innerText = price + " EGP";
    document.getElementById('modal-desc').innerText = desc || 'لا يوجد وصف متاح';
    document.getElementById('modal-img').src = img;
    document.getElementById('qty-text').innerText = "1";
    
    // تفعيل الزرار وتحويل لونه لـ برتقالي تفاعلي عند فتح أي وجبة
    const orderBtn = document.querySelector('#product-modal button[onclick="sendOrderToBot()"]');
    if (orderBtn) {
        orderBtn.className = "flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-6 rounded-xl text-center text-sm transition-all shadow-md";
        orderBtn.disabled = false;
    }
    
    updateButtonPrice();
    document.getElementById('product-modal').classList.remove('hidden');
}

        function closeModal() { document.getElementById('product-modal').classList.add('hidden'); }
        function updateQty(val) { currentProduct.qty += val; if(currentProduct.qty < 1) currentProduct.qty = 1; document.getElementById('qty-text').innerText = currentProduct.qty; updateButtonPrice(); }
        function updateButtonPrice() { document.getElementById('total-price-btn').innerText = (currentProduct.price * currentProduct.qty).toFixed(2); }

function sendOrderToBot() {
    // تجهيز البيانات بشكل نصي صريح ليفهمه تليجرام و n8n فوراً
    const dataToSend = {
        action: "add_from_webapp",
        food_name: currentProduct.name,
        quantity: parseInt(currentProduct.qty),
        price: parseFloat(currentProduct.price)
    };
    
    // تحويل الـ Object إلى String لتفادي خطأ الـ Bad Request
    Telegram.WebApp.sendData(JSON.stringify(dataToSend));
    
    // قفل النافذة المنبثقة والـ Web App تلقائياً
    closeModal();
    Telegram.WebApp.close();
}

        // تشغيل الدالة فور تحميل الصفحة
        window.onload = loadMenu;
    </script>
</body>
</html>
